name: Сообщить об ошибке
description: Проблема со звуком, медиатекой, интерфейсом или установкой Li-m.
title: "[Ошибка]: "
body:
  - type: markdown
    attributes:
      value: |
        Опишите проблему на русском, английском или казахском языке.
        Сообщение будет публичным. Не прикладывайте музыку, базу медиатеки,
        резервную копию профиля, пароли или коды входа. В снимках и тексте скрывайте
        личные пути и данные. Плеер не отправляет журналы автоматически.
  - type: input
    id: version
    attributes:
      label: Версия Li-m
      description: Посмотрите номер версии в справке или в заголовке окна.
      placeholder: Например, 0.9.0-rc.10
    validations:
      required: true
  - type: dropdown
    id: distribution
    attributes:
      label: Какую версию вы используете?
      options:
        - Установленную через Setup
        - Переносимую portable
        - Не знаю
    validations:
      required: true
  - type: dropdown
    id: windows
    attributes:
      label: Версия Windows
      options:
        - Windows 11 x64
        - Другая версия Windows
        - Не знаю
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Где возникла проблема?
      options:
        - Воспроизведение или аудиовыход
        - Медиатека, папки или кириллица
        - Плейлисты или очередь
        - Интерфейс и окна
        - Эквалайзер или визуализация
        - Установка, обновление или удаление
        - Другое
  - type: textarea
    id: steps
    attributes:
      label: Как повторить проблему?
      placeholder: |
        1. Открыл раздел…
        2. Нажал…
        3. Произошло…
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Что произошло и что вы ожидали?
      description: Если появилась ошибка, приведите её текст без личных данных.
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Дополнительные сведения
      description: При необходимости укажите формат файла, тип аудиовыхода, язык, тему или масштаб экрана. Снимок с закрытыми личными данными можно добавить сюда.
